<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26784a">
  <meta name="description" content="Learn country names, locations, flags and capitals.">
  <title>ATLAS</title>
  <link rel="icon" href="./img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/map.css">
  <link rel="stylesheet" href="./css/explore.css">
  <link rel="preload" href="./data/shapes.json" as="fetch" crossorigin>
  <link rel="preload" href="./data/countries.json" as="fetch" crossorigin>
  <script type="module" src="./js/explore.js"></script>
</head>
<body data-title-key="menu.explore">
  <a class="skip-link" href="#main-content" data-i18n="skip.link">Skip to content</a>
  <main id="main-content" class="explore">
    <div class="explore-intro">
      <div>
        <p class="eyebrow"><span class="eyebrow-rule" aria-hidden="true"></span><span data-i18n="explore.slogan">The world, in seven parts</span></p>
        <h1 data-i18n="explore.title">Continents</h1>
      </div>
      <p class="country-total" data-total></p>
    </div>

    <div class="explore-search">
      <label class="visually-hidden" for="country-search" data-i18n="search.label">Search for a country</label>
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="country-search" type="search" enterkeyhint="search" data-i18n-placeholder="search.placeholder" placeholder="Search for a country" data-search>
        <ul class="suggestions" id="country-suggestions" hidden data-suggestions data-i18n-aria-label="search.suggestions"></ul>
      </div>
    </div>

    <nav class="chips" data-chips data-i18n-aria-label="panel.continents" aria-label="Continents"></nav>

    <div class="explore-body" data-body>
      <nav class="continent-panel" data-continent-panel data-i18n-aria-label="panel.continents" aria-label="Continents">
        <p class="panel-label" data-i18n="panel.continents">Continents</p>
        <div class="continent-list" data-continent-list></div>
      </nav>

      <div class="map-wrap">
        <div data-map></div>
        <ul class="map-legend" data-i18n-aria-label="map.legend.aria" aria-label="Legend">
          <li><span class="swatch swatch-continent"></span><span data-i18n="map.legend.continent">Continent</span></li>
          <li><span class="swatch swatch-country"></span><span data-i18n="map.legend.country">Country</span></li>
        </ul>
        <div class="map-status" data-map-status role="status"><span data-i18n="state.loading">Loading the map…</span></div>
      </div>

      <section class="sheet" data-sheet data-state="peek" data-i18n-aria-label="country.info.title" aria-label="Selected country">
        <button class="sheet-handle" type="button" data-sheet-handle aria-expanded="false" aria-controls="sheet-list" data-i18n-aria-label="sheet.toggle" aria-label="Show or hide the country list">
          <span class="sheet-grip" aria-hidden="true"></span>
        </button>
        <div class="detail" data-detail aria-live="polite" aria-atomic="true"></div>
        <div class="sheet-list" id="sheet-list" data-sheet-list>
          <div class="sheet-list-head"><h2 data-list-heading></h2><span class="count" data-list-count></span></div>
          <div class="country-list" data-country-list></div>
        </div>
      </section>
      <button class="sheet-pill" type="button" data-sheet-pill hidden data-i18n="sheet.show">Show details</button>
    </div>
    <noscript><p class="noscript" data-i18n="noscript">ATLAS needs JavaScript to display the interactive map.</p></noscript>
  </main>
</body>
</html>
